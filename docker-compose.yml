version: "3.9"

services:
  medicall:
    build: .
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - DATABASE_URL=sqlite+aiosqlite:////data/medicall.db
      - USE_MOCK_CALLE=false
    volumes:
      - medicall_data:/data
      # Mount CALL-E token cache so the container can place real calls
      - ${HOME}/.calle-mcp:/root/.calle-mcp:ro
    command: uvicorn medicall.api.main:app --host 0.0.0.0 --port 8000

volumes:
  medicall_data:
